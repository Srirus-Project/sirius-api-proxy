syntax = "proto3";
package entity;
import "entity/resource.proto";
message PresentResource {
  .entity.ResourceType resource_type = 1;
  int64 resource_id = 2;
  int32 resource_count = 3;
}
message Present {
  uint64 present_id = 1;
  int64 post_at = 2;
  optional int64 expire_at = 3;
  .entity.PresentResource present_resource = 4;
  .entity.PresentTitle title = 5;
}
message PresentTitle {
  int64 present_type_id = 1;
  string present_param_1 = 2;
  string present_param_2 = 3;
}
