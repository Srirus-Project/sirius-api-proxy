syntax = "proto3";
package app.masterdata;
import "entity/method_options/method_options.proto";

message VersionRequest {
}
message VersionResponse {
  string version = 1;
}
service MasterdataService {
  rpc Version (.app.masterdata.VersionRequest) returns (.app.masterdata.VersionResponse) {
    option (entity.method_options.skip_authentication) = true;
  }
}
