syntax = "proto3";
package entity;
import "entity/band_item.proto";
import "entity/carousel_help.proto";
import "entity/character.proto";
import "entity/comeback.proto";
import "entity/content_unlock.proto";
import "entity/deck.proto";
import "entity/degree.proto";
import "entity/event.proto";
import "entity/exchange.proto";
import "entity/gacha.proto";
import "entity/gem.proto";
import "entity/item.proto";
import "entity/live.proto";
import "entity/liveboost.proto";
import "entity/livemusic.proto";
import "entity/login_bonus.proto";
import "entity/member_card.proto";
import "entity/memory.proto";
import "entity/mission.proto";
import "entity/monthly_pass.proto";
import "entity/personal_notification.proto";
import "entity/player_profile.proto";
import "entity/profilecard.proto";
import "entity/shop.proto";
import "entity/spot.proto";
import "entity/stamp.proto";
import "entity/story_episode.proto";
import "entity/support_card.proto";
import "entity/tutorial.proto";
import "entity/vip.proto";

message PlayerData {
  repeated .entity.Item items = 1;
  repeated .entity.MemberCard member_cards = 2;
  repeated .entity.SupportCard support_cards = 3;
  repeated .entity.Deck decks = 4;
  int32 main_deck = 5;
  .entity.Gem gem = 6;
  .entity.LiveBoost live_boost = 7;
  repeated .entity.BandItem band_items = 8;
  int32 player_rank_exp = 9 [deprecated = true];
  repeated .entity.LiveScore live_score = 10;
  repeated .entity.LiveMusicReward live_music_reward = 11;
  repeated .entity.CharacterRank character_rank = 12;
  repeated .entity.CharacterFriendship character_friendship = 13;
  repeated .entity.CharacterRankReward character_rank_reward = 14 [deprecated = true];
  repeated .entity.CharacterFriendshipRankReward character_friendship_rank_reward = 15;
  repeated .entity.StoryEpisode seen_story_episodes = 16;
  repeated .entity.StoryEpisode seen_story_friendship_episodes = 17;
  .entity.LiveSkip live_skip = 18;
  repeated .entity.GachaCount gacha_count = 19;
  repeated .entity.LiveMusic live_music = 20;
  repeated .entity.ExchangeCount exchange_count = 21;
  repeated .entity.GachaPoint gacha_point = 22;
  repeated .entity.LoginBonusSheet login_bonus_update = 23;
  .entity.PlayerMissionData player_mission_data = 24;
  repeated .entity.Event events = 25;
  repeated .entity.EventBoxGachaReward event_box_gacha_rewards = 26;
  repeated .entity.Stamp stamps = 27;
  .entity.LiveSetting live_setting = 28;
  repeated .entity.LiveLaneSkin live_lane_skins = 29;
  repeated .entity.LiveNoteSkin live_note_skins = 30;
  repeated .entity.LiveNoteEffectSkin live_note_effect_skins = 31;
  repeated .entity.LiveNoteSeGroup live_note_se_groups = 32;
  repeated .entity.CarouselHelp shown_carousel_helps = 33;
  .entity.PlayerSimpleProfile my_profile = 34;
  .entity.LiveStampReward live_stamp_reward = 35;
  repeated .entity.LiveMusicComboReward live_music_combo_reward = 36;
  .entity.Comeback comeback = 37;
  repeated .entity.StampFavoriteName stamp_favorite_names = 38;
  repeated .entity.ContentUnlock shown_content_unlocks = 39;
  optional uint64 circle_id = 40;
  repeated .entity.ChallengeLive challenge_live = 41;
  repeated .entity.PurchaseTransaction remain_transactions = 42;
  repeated .entity.Degree degrees = 43;
  repeated int64 chat_themes = 44;
  repeated int64 chat_bubbles = 45;
  repeated int64 chat_frames = 46;
  bool has_password = 47;
  repeated .entity.LinkedAccountType linked_account_types = 48;
  .entity.MemoryStatus memory_status = 49;
  .entity.Vip vip = 50;
  repeated .entity.ProfileCardDetail profile_card_details = 51;
  repeated .entity.MonthlyPassState monthly_passes = 52;
  .entity.TutorialProgress tutorial_progress = 53;
  repeated int64 background_ids = 54;
  repeated int64 character_orders = 55;
  repeated int64 favorite_spot_ids = 56;
  repeated .entity.Spot spots = 57;
  bool is_night_notice_off = 58;
  repeated .entity.MusicPuzzle puzzles = 59;
  .entity.PersonalNotification personal_notification = 60;
}
enum LinkedAccountType {
  LINKED_ACCOUNT_TYPE_UNSPECIFIED = 0;
  LINKED_ACCOUNT_TYPE_APPLE = 1;
  LINKED_ACCOUNT_TYPE_GOOGLE = 2;
  LINKED_ACCOUNT_TYPE_GAME_CENTER = 3;
  LINKED_ACCOUNT_TYPE_BUSHIROAD = 4;
}
