# Region and deployment environment are independent. See docs/REGIONS.md.
region: jp
platform: iOS
listen: 127.0.0.1:9999
environment: release
endpoint: https://api.bang-dream-on.jp
client_version: 1.0.3
# Serialize upstream calls for the configured account. Restart after changing.
# Set false to allow concurrent calls; upstream concurrency support is unconfirmed.
session_lock: true
protocol_directory: ./protocol/sirius/1.0.3
api_token_env: SIRIUS_API_TOKEN
internal_token_env: SIRIUS_INTERNAL_TOKEN
# Optional dedicated read-only node credential; see docs/PEER_QUERIES.md.
# peer_token_env: SIRIUS_JP_PEER_TOKEN
# Optional existing game account; both references must be set together.
# player_id_env: SIRIUS_PLAYER_ID
# player_credential_env: SIRIUS_PLAYER_CREDENTIAL
# Local JSON snapshots; populate using master-import before enabling.
# master_directory: ./master-data
# Enable only when CDN username/password and Master key/IV are configured.
# Runs once on startup, then waits this interval after each completed attempt.
# master_update:
#   username_env: SIRIUS_CDN_USERNAME
#   key_hex_env: SIRIUS_MASTER_KEY_HEX
#   iv_hex_env: SIRIUS_MASTER_IV_HEX
#   interval_seconds: 300
#   # See docs/MASTER_NETWORK.md. This client is independent of game upstream proxy.
#   network:
#     connect_timeout_ms: 10000
#     request_timeout_ms: 60000
#     update_timeout_seconds: 600
#     attempts: 1
#     retry_delay_ms: 250
#     max_retry_delay_ms: 5000
#     # proxy_url_env: SIRIUS_MASTER_PROXY_URL
#     # proxy_authorization_env: SIRIUS_MASTER_PROXY_AUTHORIZATION
# Alternatively, synchronize verified plaintext snapshots from another Sirius API.
# Requires master_directory; cannot be combined with master_update.
# See docs/MASTER_REGISTRY.md. The token is the owner's public read bearer.
# master_sync:
#   origin: https://master-owner.example.invalid
#   token_env: SIRIUS_MASTER_OWNER_TOKEN
#   regional_paths: false
#   allow_http: false
#   interval_seconds: 300
#   timeout_seconds: 600
#   request_timeout_ms: 60000
default_cdn_root: https://static.bang-dream-on.jp
cdn_credential_env:
  https://static.bang-dream-on.jp: SIRIUS_CDN_CREDENTIAL

# Optional existing-account pool replaces the legacy account references above.
# See docs/ACCOUNTS.md for credential files, reload and failure policy.
# accounts:
#   - name: primary
#     player_id_env: SIRIUS_JP_PRIMARY_ID
#     credential_env: SIRIUS_JP_PRIMARY_CREDENTIAL
account_pool:
  failure_threshold: 2
  cooldown_seconds: 30

# Logical gRPC request policy, independently scoped to this region.
upstream:
  connect_timeout_ms: 10000
  # Optional per-region HTTP(S) CONNECT proxy; see docs/UPSTREAM_PROXY.md.
  # proxy_url_env: SIRIUS_JP_PROXY_URL
  # proxy_authorization_env: SIRIUS_JP_PROXY_AUTH
  timeout_ms: 20000
  max_response_bytes: 8388608
  max_inflight: 64
  anonymous_attempts: 1 # total attempts; 1 disables retries
  retry_delay_ms: 250

# Public announcement/ranking response cache; defaults to disabled.
# See docs/RESPONSE_CACHE.md for memory/Redis, per-route TTL and opt-in stale-while-revalidate.
response_cache:
  backend: disabled

# Optional HTTPS listener; see docs/LISTENER_TLS.md. Restart after certificate renewal.
# tls:
#   certificate_file: /etc/sirius/tls/fullchain.pem
#   private_key_file: /etc/sirius/tls/key.pem
#   handshake_timeout_ms: 10000

# Optional access logging. Omitted means disabled. See docs/ACCESS_LOG.md.
# access_log:
#   format: json
#   output: {type: file, path: ./logs/access.log, rotation: daily, max_files: 7}
#   queue_capacity: 4096
#   trusted_proxies: [] # only configured CIDRs may supply forwarding headers
#   proxy_header: x-forwarded-for

# Optional application events; default is info/text on stderr. See docs/APPLICATION_LOG.md.
# logging:
#   level: info
#   format: json
#   output: {type: file, path: ./logs/application.log, rotation: daily, max_files: 7}
#   queue_capacity: 4096

# Optional per-region automatic asset update owner. See docs/ASSET_DISPATCH.md.
# asset_dispatch:
#   state_directory: ./state/jp-assets
#   interval_seconds: 60
#   request_timeout_ms: 10000
#   history_capacity: 10000
#   targets:
#     - origin: https://asset-updater.example.com
#       token_env: SIRIUS_ASSET_UPDATER_TOKEN
#       allow_http: false
#       profile: jp-full
#       profile_revision: "1"
#       require_full_catalog: true
#       require_full_export: true
#       require_publication: true

# Optional local/remote public-query routing; see docs/NODE_ROUTING.md.
# node_routing:
#   local_priority: 0
#   targets:
#     - name: secondary
#       origin: https://secondary.example.invalid
#       token_env: SIRIUS_JP_SECONDARY_PEER_TOKEN
#       priority: 10
#       regional_paths: true

# Optional Master owner notifications. Requires master_directory; JP only.
# Each token authorizes the remote consumer's internal endpoint and must be distinct
# from this deployment's local credentials. See docs/MASTER_REGISTRY.md.
# master_notify:
#   interval_seconds: 30
#   request_timeout_ms: 5000
#   targets:
#     - name: replica
#       origin: https://replica.example
#       token_env: SIRIUS_MASTER_REPLICA_NOTIFY_TOKEN
#       regional_paths: true
#       allow_http: false

# Optional JP Master Git publication (Unix or Windows; requires master_directory).
# Separate managed state, never a source checkout. No remote means local commits only.
# master_git:
#   state_directory: ./data/master-git
#   interval_seconds: 300
#   commit:
#     author:
#       name: Sirius Master Publisher
#       email: sirius-master@localhost
#     # committer defaults to author; omit signing for unsigned commits.
#     # signing:
#     #   format: ssh # or openpgp with a hexadecimal fingerprint in key
#     #   key: /run/secrets/master-signing-key
#     #   program: /usr/bin/ssh-keygen
#   remote:
#     url: https://git.example.invalid/master-data.git
#     authorization_env: SIRIUS_MASTER_GIT_AUTHORIZATION
#     # proxy_url_env: SIRIUS_MASTER_GIT_PROXY_URL
#     allow_http: false
#     allow_file: false

# Optional verified Master database mirror, independent of local snapshot availability.
# See docs/MASTER_DATABASE.md. Set master_directory before enabling.
# master_database:
#   interval_seconds: 300
#   connection:
#     host: database.example.invalid
#     database: sirius_master
#     username: sirius_master
#     password_env: SIRIUS_MASTER_DATABASE_PASSWORD
#     timeout_seconds: 120
#     keep_snapshots: 20
#     max_read_connections: 4

# Optional per-client API tokens (X-Sirius-Token) with PostgreSQL users and region grants.
# See docs/CLIENT_AUTH.md. The static API bearer keeps working.
# client_auth:
#   signing_key_env: SIRIUS_CLIENT_JWT_KEY
#   cache_seconds: 60
#   cache_entries: 10000
#   database:
#     host: database.example.invalid
#     database: sirius_clients
#     username: sirius_client_reader
#     password_env: SIRIUS_CLIENT_DB_PASSWORD
#     timeout_seconds: 10
#     max_connections: 4
