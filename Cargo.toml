[package]
name = "sirius-api-proxy"
version = "1.1.0"
edition = "2021"
rust-version = "1.96"
description = "API proxy for BanG Dream! Our Notes"
repository = "https://github.com/Srirus-Project/sirius-api-proxy"
readme = "README.md"
license = "MIT"
publish = false

[dependencies]
tar = { version = "0.4.46", default-features = false }
tokio-util = { version = "0.7", features = ["io"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json"] }
base64 = "0.22"
tracing-appender = "0.2"
ipnet = "2"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
axum = "0.8"
bytes = "1"
httparse = "1"
tower-service = "0.3"
chrono = { version = "0.4", features = ["serde"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "webpki-roots", "ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
prost = "0.14"
pbjson = "0.9"
pbjson-types = "0.9"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.9"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
sha2 = "0.10"
flate2 = "1"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
redis = { version = "1.7", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots", "connection-manager"] }

[build-dependencies]
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
pbjson-build = "0.9"
protox = "0.9"
prost-reflect = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
heck = "0.5"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "http2"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
