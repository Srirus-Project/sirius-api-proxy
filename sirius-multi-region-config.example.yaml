# JSON is valid YAML. Global CDN URLs are placeholders; configure verified roots.
{
  "listen": "127.0.0.1:9999",
  "regions": {
    "jp": {
      "region": "jp",
      "platform": "iOS",
      "environment": "release",
      "endpoint": "https://api.bang-dream-on.jp",
      "client_version": "1.0.3",
      "session_lock": true,
      "protocol_directory": "protocol/sirius/1.0.3",
      "api_token_env": "SIRIUS_JP_API_TOKEN",
      "internal_token_env": "SIRIUS_JP_INTERNAL_TOKEN",
      "default_cdn_root": "https://static.bang-dream-on.jp",
      "cdn_credential_env": {
        "https://static.bang-dream-on.jp": "SIRIUS_JP_CDN_CREDENTIAL"
      }
    },
    "tw": {
      "region": "tw",
      "platform": "Android",
      "environment": "release",
      "endpoint": "https://l12-prod-hk-all-gs-sirius.gamerfusiontech.com",
      "client_version": "1.0.1",
      "session_lock": true,
      "protocol_directory": "protocol/global/1.0.1",
      "api_token_env": "SIRIUS_TW_API_TOKEN",
      "internal_token_env": "SIRIUS_TW_INTERNAL_TOKEN",
      "default_cdn_root": "https://cdn.example.invalid/prod/tw_REPLACE_FROM_SERVER_LIST",
      "cdn_credential_env": {
        "https://cdn.example.invalid/prod/tw_REPLACE_FROM_SERVER_LIST": "SIRIUS_TW_CDN_CREDENTIAL"
      }
    },
    "en": {
      "region": "en",
      "platform": "Android",
      "environment": "release",
      "endpoint": "https://l14-prod-va-all-gs-sirius.bilibiligame.net",
      "client_version": "1.0.1",
      "session_lock": true,
      "protocol_directory": "protocol/global/1.0.1",
      "api_token_env": "SIRIUS_EN_API_TOKEN",
      "internal_token_env": "SIRIUS_EN_INTERNAL_TOKEN",
      "default_cdn_root": "https://cdn.example.invalid/prod/en_REPLACE_FROM_SERVER_LIST",
      "cdn_credential_env": {
        "https://cdn.example.invalid/prod/en_REPLACE_FROM_SERVER_LIST": "SIRIUS_EN_CDN_CREDENTIAL"
      }
    },
    "kr": {
      "region": "kr",
      "platform": "Android",
      "environment": "release",
      "endpoint": "https://l14-prod-kr-all-gs-sirius.bilibiligame.net",
      "client_version": "1.0.1",
      "session_lock": true,
      "protocol_directory": "protocol/global/1.0.1",
      "api_token_env": "SIRIUS_KR_API_TOKEN",
      "internal_token_env": "SIRIUS_KR_INTERNAL_TOKEN",
      "default_cdn_root": "https://cdn.example.invalid/prod/kr_REPLACE_FROM_SERVER_LIST",
      "cdn_credential_env": {
        "https://cdn.example.invalid/prod/kr_REPLACE_FROM_SERVER_LIST": "SIRIUS_KR_CDN_CREDENTIAL"
      }
    }
  }
}

