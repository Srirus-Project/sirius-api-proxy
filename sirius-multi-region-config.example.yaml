# Multi-region deployment. Global CDN roots are the first CDN line of each region's server-list
# entry. Global Master CDNs need no credential; see docs/examples/master-publisher.yaml for
# master_update/master_git in every region.
listen: 127.0.0.1:9999
regions:
  jp:
    region: "jp"
    platform: "iOS"
    environment: "release"
    endpoint: "https://api.bang-dream-on.jp"
    client_version: "1.0.3"
    session_lock: true
    protocol_directory: "protocol/sirius/1.0.3"
    api_token_env: "SIRIUS_JP_API_TOKEN"
    internal_token_env: "SIRIUS_JP_INTERNAL_TOKEN"
    default_cdn_root: "https://static.bang-dream-on.jp"
    cdn_credential_env:
      "https://static.bang-dream-on.jp": "SIRIUS_JP_CDN_CREDENTIAL"
  tw:
    region: "tw"
    platform: "Android"
    environment: "release"
    endpoint: "https://l12-prod-hk-all-gs-sirius.gamerfusiontech.com"
    client_version: "1.0.1"
    session_lock: true
    protocol_directory: "protocol/global/1.0.1"
    api_token_env: "SIRIUS_TW_API_TOKEN"
    internal_token_env: "SIRIUS_TW_INTERNAL_TOKEN"
    default_cdn_root: "https://l14-prod-hk-patch-sirius.gamerfusiontech.com/prod/hk_27f3c91e8b62d6056c7a19f2e83b6d10"
    cdn_credential_env: {}
  en:
    region: "en"
    platform: "Android"
    environment: "release"
    endpoint: "https://l14-prod-va-all-gs-sirius.bilibiligame.net"
    client_version: "1.0.1"
    session_lock: true
    protocol_directory: "protocol/global/1.0.1"
    api_token_env: "SIRIUS_EN_API_TOKEN"
    internal_token_env: "SIRIUS_EN_INTERNAL_TOKEN"
    default_cdn_root: "https://l14-prod-sg-patch-sirius.bilibiligame.net/prod/en_3e8a72c5f1d9066b9a37c2e85f619db0"
    cdn_credential_env: {}
  kr:
    region: "kr"
    platform: "Android"
    environment: "release"
    endpoint: "https://l14-prod-kr-all-gs-sirius.bilibiligame.net"
    client_version: "1.0.1"
    session_lock: true
    protocol_directory: "protocol/global/1.0.1"
    api_token_env: "SIRIUS_KR_API_TOKEN"
    internal_token_env: "SIRIUS_KR_INTERNAL_TOKEN"
    default_cdn_root: "https://l14-prod-sg-patch-sirius.bilibiligame.net/prod/kr_461b4e9a7c2385f0e2d966a1b73c8f52"
    cdn_credential_env: {}

# Optional HTTPS listener; see docs/LISTENER_TLS.md. Restart after certificate renewal.
# tls:
